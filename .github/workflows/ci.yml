name: Repository checks
on: [push, pull_request]
jobs:
  function-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/ci.py
      - run: python3 scripts/update-progress.py --check
